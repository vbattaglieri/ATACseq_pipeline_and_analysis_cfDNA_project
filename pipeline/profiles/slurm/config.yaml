# Snakemake SLURM profile
# Run with:  snakemake --profile profiles/slurm --use-conda
#
# Requires the snakemake-executor-plugin-slurm (Snakemake >= 8):
#   pip install snakemake-executor-plugin-slurm

executor: slurm
use-conda: true
jobs: 20
latency-wait: 60
rerun-incomplete: true
printshellcmds: true

default-resources:
  slurm_partition: "batch"
  runtime: 720          # minutes
  mem_mb: 16000
  cpus_per_task: 4

# Per-rule resource overrides (match the heavier steps)
set-resources:
  bwa_mem2:
    cpus_per_task: 16
    mem_mb: 64000
    runtime: 1440
  xenome_classify:
    cpus_per_task: 16
    mem_mb: 48000
    runtime: 1440
  mark_duplicates:
    mem_mb: 32000
  consensus_peaks:
    mem_mb: 32000
    runtime: 240
